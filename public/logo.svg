<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 44" fill="none">
  <!-- Shadow glow -->
  <ellipse cx="20" cy="40" rx="11" ry="2.2" fill="#c89010" opacity="0.35"/>

  <!-- Hat cone body -->
  <polygon points="20,3 7,31 33,31" fill="#1a0840" stroke="#c89018" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- Left-face shadow -->
  <polygon points="20,3 7,31 20,31" fill="#0b0220" opacity="0.5"/>

  <!-- Gold band -->
  <rect x="8" y="27" width="24" height="4" rx="1.8" fill="#c89010"/>
  <!-- Band highlight -->
  <rect x="8" y="27" width="24" height="1.6" rx="1.8" fill="#f0d060" opacity="0.38"/>

  <!-- Centre gem -->
  <circle cx="20" cy="29" r="2.1" fill="#f0d050"/>
  <circle cx="20" cy="29" r="0.75" fill="#fff" opacity="0.7"/>

  <!-- Brim -->
  <ellipse cx="20" cy="31" rx="13.5" ry="3.4" fill="#1e0840" stroke="#c89018" stroke-width="0.85"/>
  <ellipse cx="20" cy="30.5" rx="11.5" ry="2" fill="#32126a" opacity="0.55"/>

  <!-- Hat tip glow -->
  <circle cx="20" cy="4" r="2.4" fill="#e8c060" opacity="0.7"/>

  <!-- Star rune -->
  <text x="20" y="21" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#f0d060" font-family="serif">✦</text>

  <!-- Sparkles -->
  <circle cx="8"  cy="13"  r="1.4" fill="#f0d050" opacity="0.85"/>
  <circle cx="32" cy="11"  r="1.1" fill="#c0a0ff" opacity="0.75"/>
  <circle cx="37" cy="22"  r="0.9" fill="#f0e060" opacity="0.65"/>
  <circle cx="3"  cy="23"  r="1.1" fill="#a060ff" opacity="0.75"/>
  <circle cx="22" cy="0.5" r="1"   fill="#f0e880" opacity="0.85"/>
</svg>
